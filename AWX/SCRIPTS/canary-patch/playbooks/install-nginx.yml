---
- name: Installer nginx - configuration de base
  hosts: all
  become: yes
  tasks:
    - name: Installer nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Deployer la configuration
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Redemarrer nginx

  handlers:
    - name: Redemarrer nginx
      service:
        name: nginx
        state: restarted
